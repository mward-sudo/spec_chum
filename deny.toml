# cargo-deny configuration — Refs #171 (engineering quality, Pillar B).
# Local: `./scripts/check_deny.sh`. CI: non-blocking `cargo-deny` workflow.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Keep advisories as errors so CI surfaces them; the workflow is continue-on-error
# until we dispose each finding (upgrade, ignore-with-reason, or follow-up issue).
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
