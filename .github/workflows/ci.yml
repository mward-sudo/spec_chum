name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio/GUI deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libglib2.0-dev libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache ROMs
        id: rom-cache
        uses: actions/cache@v4
        with:
          path: |
            roms
            .rom-cache
          key: roms-${{ hashFiles('scripts/fetch_roms.sh') }}

      - name: Fetch ROMs
        run: ./scripts/fetch_roms.sh

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  z80doc:
    name: z80doc (slow-tests, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache ROMs
        id: rom-cache
        uses: actions/cache@v4
        with:
          path: |
            roms
            .rom-cache
          key: roms-${{ hashFiles('scripts/fetch_roms.sh') }}

      - name: Fetch ROMs
        run: ./scripts/fetch_roms.sh

      - name: z80doc
        run: cargo test -p machine --features slow-tests --release z80doc_all_tests_passed -- --nocapture

  # Optional SwiftUI shell compile (#68). Independent of Linux `check` — does not block Rust CI.
  macos-shell:
    name: macos-shell (host_api + Swift)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Root Cargo workspace only — apps/macos is SwiftPM (no Cargo.toml).
          workspaces: .

      - name: Build macOS shell
        run: ./scripts/build_macos_app.sh
