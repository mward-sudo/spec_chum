# PR status check: for ready PRs, fail when CodeRabbit has not completed a
# review on HEAD (pending / in progress / missing / error / on-demand or label
# skip without a request). GitHub rate-limited *after* a request: soft-passes
# gate 1 when reset is >10m (parsed from status description) or unparsable
# (loud warning); HOLDs when parsed reset ≤10m. CI cannot see local CR; agents
# must still confirm either-completed OR dual rate-limit (both sides >10m)
# before merge. Soft-pass ≠ on-demand/label skip. Drafts skip CR completeness.
# Always fail when unresolved CodeRabbit/bot review threads remain.
# Uses default GITHUB_TOKEN (pull-requests: read, checks: write) — no extra secrets.
#
# Checkout uses the PR base (or default branch) so the checker script comes from a
# trusted ref before GH_TOKEN is exposed — not the untrusted merge/head ref.
#
# Note: the workflow *definition* still comes from the merge commit on `pull_request`
# events. Switching to `pull_request_target` is deferred until this file lives on
# the default branch (otherwise the gate cannot run on the introducing PR).
# The `status` trigger only runs from the default-branch workflow copy (after merge).
#
# Re-runs when reviews/comments arrive, and when CodeRabbit updates its commit
# status (so terminal "Review completed" / "Review rate limited" clears a prior
# pending/in-progress failure without a manual re-run). Resolving a thread does
# not always emit an event — re-run this job after fixing if needed.
name: Bot review threads

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # CodeRabbit often flips commit status to rate-limited/completed without a new
  # review event — without this, gate 1 stays red after a transient pending hold.
  status:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (required for manual runs outside a PR)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: read

# One in-flight gate per PR (or commit SHA for status events) so a cancelled/
# superseded run cannot publish a stale success after a newer failure for the
# same head SHA.
concurrency:
  group: bot-review-threads-${{ github.event.pull_request.number || inputs.pr_number || github.event.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  check-bot-threads:
    name: unresolved bot threads
    # status events fire for every commit status; only act on CodeRabbit.
    if: ${{ github.event_name != 'status' || github.event.context == 'CodeRabbit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Classify self-test
        run: |
          set -euo pipefail
          if [[ ! -x ./scripts/check_pr_reviews.sh ]]; then
            echo "scripts/check_pr_reviews.sh not present on trusted base ref; skipping self-test (bootstrap)."
            exit 0
          fi
          ./scripts/check_pr_reviews.sh --self-test

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          STATUS_SHA: ${{ github.event.sha }}
        run: |
          set -euo pipefail
          n="${PR_FROM_EVENT:-}"
          if [[ -z "$n" ]]; then
            n="${PR_FROM_INPUT:-}"
          fi
          if [[ -z "${n:-}" && "${EVENT_NAME}" == "status" && -n "${STATUS_SHA:-}" ]]; then
            # Map commit → open PR(s). Prefer the newest open PR for this SHA.
            n="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${STATUS_SHA}/pulls" \
              --jq '[.[] | select(.state == "open")] | sort_by(.updated_at) | reverse | .[0].number // empty')"
            if [[ -z "${n:-}" ]]; then
              echo "No open PR for CodeRabbit status on ${STATUS_SHA:0:12}; nothing to check."
              echo "number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -z "${n:-}" ]]; then
            echo "Could not determine PR number for event ${EVENT_NAME:-unknown}" >&2
            exit 2
          fi
          if [[ ! "$n" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number: $n" >&2
            exit 2
          fi
          printf 'number=%s\n' "$n" >> "$GITHUB_OUTPUT"
          echo "Checking PR #$n"

      - name: Resolve PR head SHA
        id: head
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          STATUS_SHA: ${{ github.event.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha="${EVENT_HEAD:-}"
          if [[ -z "$sha" ]]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head SHA: $sha" >&2
            exit 2
          fi
          # If this status event is for an older commit than PR head, skip —
          # a newer synchronize/status run owns the gate for current HEAD.
          if [[ "${EVENT_NAME}" == "status" && -n "${STATUS_SHA:-}" && "$STATUS_SHA" != "$sha" ]]; then
            echo "CodeRabbit status is for ${STATUS_SHA:0:12}, but PR #$PR_NUMBER head is ${sha:0:12}; skipping stale SHA."
            printf 'sha=\n' >> "$GITHUB_OUTPUT"
            printf 'skip=stale-sha\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'skip=\n' >> "$GITHUB_OUTPUT"

      - name: Check CodeRabbit HEAD status + unresolved bot threads
        id: gate
        if: ${{ steps.pr.outputs.number != '' && steps.head.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Bootstrap: this workflow checks out the PR base (trusted). On the
          # introducing PR the script is not on base yet — skip rather than
          # checking out untrusted head code. After merge, base has the script.
          if [[ ! -x ./scripts/check_pr_reviews.sh ]]; then
            echo "scripts/check_pr_reviews.sh not present on trusted base ref; skipping CI gate (bootstrap)."
            echo "Local/agent gate remains mandatory: ./scripts/check_pr_reviews.sh"
            exit 0
          fi
          ./scripts/check_pr_reviews.sh "$PR_NUMBER"

      # Required checks key off the PR head; review_comment runs may otherwise
      # attach only to a merge-ref GITHUB_SHA and leave a stale head check green.
      # !cancelled(): do not publish after concurrency cancel-in-progress.
      # Runs on gate failure too so head gets an explicit failure check-run.
      - name: Publish check on PR head
        if: ${{ !cancelled() && steps.pr.outputs.number != '' && steps.head.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          conclusion=failure
          title='CodeRabbit / bot review gate failed'
          if [[ "${GATE_OUTCOME:-failure}" == "success" ]]; then
            conclusion=success
            title='CodeRabbit clean + no unresolved bot threads'
          elif [[ "${GATE_OUTCOME:-}" == "skipped" ]]; then
            conclusion=neutral
            title='Bot review gate skipped'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='unresolved bot threads' \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]='"$title" \
            -f 'output[summary]=Ready PRs: hard-fails pending/missing/error/on-demand-skip, rate-limit with parsed reset ≤10m, or unresolved bot threads. GitHub rate-limited soft-passes CI when reset >10m or unparsable (not Review completed); agents must confirm either-completed OR dual rate-limit both sides >10m. Soft-pass ≠ on-demand skip. Drafts skip CR completeness. See workflow run.'
