# PR status check: for ready PRs, fail when CodeRabbit has not completed a
# review on HEAD (pending / in progress / missing / error / on-demand or label
# skip without a request). GitHub rate-limited *after* a request: soft-passes
# gate 1 when reset is >10m (parsed from status description) or unparsable
# (loud warning); HOLDs when parsed reset ≤10m. CI cannot see local CR; agents
# must still confirm either-completed OR dual rate-limit (both sides >10m)
# before merge. Soft-pass ≠ on-demand/label skip. Drafts skip CR completeness.
# Always fail when unresolved CodeRabbit/bot review threads remain.
# Uses default GITHUB_TOKEN (pull-requests: read, checks: write, statuses: write)
# — no extra secrets.
#
# Checkout uses the PR base (or default branch) so the checker script comes from a
# trusted ref before GH_TOKEN is exposed — not the untrusted merge/head ref.
#
# Note: the workflow *definition* still comes from the merge commit on `pull_request`
# events. Switching to `pull_request_target` is deferred until this file lives on
# the default branch (otherwise the gate cannot run on the introducing PR).
# The `status` trigger only runs from the default-branch workflow copy (after merge).
#
# Re-runs when reviews/comments arrive, and when CodeRabbit updates its commit
# status (so terminal "Review completed" / "Review rate limited" clears a prior
# pending/in-progress failure without a manual re-run). Resolving a thread does
# not always emit an event — re-run this job after fixing if needed.
#
# Required ruleset context is the commit status named "unresolved bot threads"
# (classic statuses API). We also publish a check-run with the same name for
# Checks UI. The Actions job uses a different name so cancel-in-progress
# cancelled job checks cannot keep main merge BLOCKED after a newer soft-pass
# publish (lesson: #312 / #318 after #314). Check-run alone is not enough when
# the ruleset expects a status context (#321 merge / #323).
#
# Recheck path (user-visible stale-fail fix):
#   CodeRabbit updates commit status (pending → completed / rate-limited)
#   → `on: status` (default-branch workflow) with context CodeRabbit
#   → map STATUS_SHA → open PR head → ./scripts/check_pr_reviews.sh
#   → Publish/update required status (+ check-run) "unresolved bot threads"
#     on that head.
# Without `status` (pre-#314) the gate never re-read CR and stayed red until a
# new PR/review event or manual workflow_dispatch (#312). With `status` but the
# job sharing the required name, cancelled/failed Actions checks still looked
# like a stale bot-gate fail (#317).
name: Bot review threads

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # CodeRabbit often flips commit status to rate-limited/completed without a new
  # review event — without this, gate 1 stays red after a transient pending hold.
  status:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (required for manual runs outside a PR)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

# One in-flight gate per head SHA (PR head for pull_request*; status SHA when
# CodeRabbit posts on that head). Shared key so status soft-pass cancels an
# in-flight pull_request pending/queued hold for the same commit.
concurrency:
  group: bot-review-threads-${{ github.event.pull_request.head.sha || github.event.sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-bot-threads:
    # NOT the ruleset context — see Publish step (name: unresolved bot threads).
    name: bot-review-gate
    # status events fire for every commit status; only act on CodeRabbit.
    if: ${{ github.event_name != 'status' || github.event.context == 'CodeRabbit' || github.event.context == 'coderabbit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Log CodeRabbit status trigger
        if: ${{ github.event_name == 'status' }}
        env:
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_STATE: ${{ github.event.state }}
          STATUS_DESC: ${{ github.event.description }}
          STATUS_CTX: ${{ github.event.context }}
        run: |
          set -euo pipefail
          echo "Recheck trigger: CodeRabbit commit status changed"
          echo "  sha=${STATUS_SHA:0:12} context=$STATUS_CTX state=$STATUS_STATE"
          echo "  description=${STATUS_DESC:-}"

      - name: Classify self-test
        run: |
          set -euo pipefail
          if [[ ! -x ./scripts/check_pr_reviews.sh ]]; then
            echo "scripts/check_pr_reviews.sh not present on trusted base ref; skipping self-test (bootstrap)."
            exit 0
          fi
          ./scripts/check_pr_reviews.sh --self-test

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          STATUS_SHA: ${{ github.event.sha }}
        run: |
          set -euo pipefail
          n="${PR_FROM_EVENT:-}"
          if [[ -z "$n" ]]; then
            n="${PR_FROM_INPUT:-}"
          fi
          if [[ -z "${n:-}" && "${EVENT_NAME}" == "status" && -n "${STATUS_SHA:-}" ]]; then
            # Map commit → open PR whose *head* is this SHA (not merely containing it).
            # gh api --jq takes one expression; pass --arg to standalone jq (#331).
            n="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${STATUS_SHA}/pulls" \
              | jq -r --arg sha "$STATUS_SHA" \
              '[.[] | select(.state == "open" and .head.sha == $sha)] | sort_by(.updated_at) | reverse | .[0].number // empty')"
            if [[ -z "${n:-}" ]]; then
              echo "No open PR head matching CodeRabbit status on ${STATUS_SHA:0:12}; nothing to check."
              echo "number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -z "${n:-}" ]]; then
            echo "Could not determine PR number for event ${EVENT_NAME:-unknown}" >&2
            exit 2
          fi
          if [[ ! "$n" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number: $n" >&2
            exit 2
          fi
          printf 'number=%s\n' "$n" >> "$GITHUB_OUTPUT"
          echo "Checking PR #$n"

      - name: Resolve PR head SHA
        id: head
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          STATUS_SHA: ${{ github.event.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha="${EVENT_HEAD:-}"
          if [[ -z "$sha" ]]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head SHA: $sha" >&2
            exit 2
          fi
          # If this status event is for an older commit than PR head, skip —
          # a newer synchronize/status run owns the gate for current HEAD.
          if [[ "${EVENT_NAME}" == "status" && -n "${STATUS_SHA:-}" && "$STATUS_SHA" != "$sha" ]]; then
            echo "CodeRabbit status is for ${STATUS_SHA:0:12}, but PR #$PR_NUMBER head is ${sha:0:12}; skipping stale SHA."
            printf 'sha=\n' >> "$GITHUB_OUTPUT"
            printf 'skip=stale-sha\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'skip=\n' >> "$GITHUB_OUTPUT"

      - name: Check CodeRabbit HEAD status + unresolved bot threads
        id: gate
        if: ${{ steps.pr.outputs.number != '' && steps.head.outputs.sha != '' }}
        # Publish must run even when the script fails — required check is the
        # API-published run, not this job. Fail the job only after Publish.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Bootstrap: this workflow checks out the PR base (trusted). On the
          # introducing PR the script is not on base yet — skip rather than
          # checking out untrusted head code. After merge, base has the script.
          if [[ ! -x ./scripts/check_pr_reviews.sh ]]; then
            echo "scripts/check_pr_reviews.sh not present on trusted base ref; skipping CI gate (bootstrap)."
            echo "Local/agent gate remains mandatory: ./scripts/check_pr_reviews.sh"
            exit 0
          fi
          ./scripts/check_pr_reviews.sh "$PR_NUMBER"

      # Ruleset required context is the commit status "unresolved bot threads"
      # (not the job name). Also publish a same-named check-run for Checks UI.
      # !cancelled(): do not publish after concurrency cancel-in-progress so a
      # superseded run cannot overwrite a newer conclusion. Runs on gate
      # failure too (`!cancelled()` opts out of skip-after-failure).
      - name: Publish status on PR head
        if: ${{ !cancelled() && steps.pr.outputs.number != '' && steps.head.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          conclusion=failure
          state=failure
          title='CodeRabbit / bot review gate failed'
          if [[ "${GATE_OUTCOME:-failure}" == "success" ]]; then
            conclusion=success
            state=success
            title='CodeRabbit clean + no unresolved bot threads'
          elif [[ "${GATE_OUTCOME:-}" == "skipped" ]]; then
            conclusion=neutral
            # statuses API has no neutral; treat skip as success so ruleset is not held.
            state=success
            title='Bot review gate skipped'
          fi
          # Classic commit status — this is what the branch ruleset requires (#323).
          # Truncate description to GitHub's 140-char statuses limit.
          desc="$title"
          if ((${#desc} > 140)); then
            desc="${desc:0:137}..."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='unresolved bot threads' \
            -f description="$desc" \
            -f target_url="$RUN_URL"
          # external_id stable per head so re-publishes update the same logical
          # check in UIs that key on it; name matches the ruleset context.
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='unresolved bot threads' \
            -f head_sha="$HEAD_SHA" \
            -f external_id="bot-review-threads-${HEAD_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]='"$title" \
            -f 'output[summary]=Ready PRs: hard-fails pending/missing/error/on-demand-skip, rate-limit with parsed reset ≤10m, or unresolved bot threads. GitHub rate-limited soft-passes CI when reset >10m or unparsable (not Review completed); agents must confirm either-completed OR dual rate-limit both sides >10m. Soft-pass ≠ on-demand skip. Drafts skip CR completeness. Job name is bot-review-gate (not required); ruleset context is the published commit status (check-run is supplemental). See workflow run.'

      # Job name is bot-review-gate (not ruleset-required). Still fail the job
      # for Actions UI after the required status has been published/updated.
      - name: Fail job when gate failed
        if: ${{ !cancelled() && steps.gate.outcome == 'failure' }}
        run: |
          set -euo pipefail
          echo "bot-review-gate failed after publishing required status 'unresolved bot threads'." >&2
          echo "On CodeRabbit status changes the workflow re-runs (on: status) and re-publishes." >&2
          exit 1
