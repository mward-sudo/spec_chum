# PR status check: fail when unresolved CodeRabbit/bot review threads remain.
# Uses default GITHUB_TOKEN (pull-requests: read) — no extra secrets.
# Re-runs when reviews/comments arrive (CodeRabbit often posts after the first push).
# Resolving a thread does not always emit an event — re-run this job after fixing.
#
# Checkout uses the PR base (or default branch) so the checker script comes from a
# trusted ref before GH_TOKEN is exposed — not the untrusted merge/head ref.
name: Bot review threads

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (required for manual runs outside a PR)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  check-bot-threads:
    name: unresolved bot threads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve PR number
        id: pr
        env:
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          n="${PR_FROM_EVENT:-}"
          if [[ -z "$n" ]]; then
            n="${PR_FROM_INPUT:-}"
          fi
          if [[ -z "${n:-}" ]]; then
            echo "Could not determine PR number for event ${GITHUB_EVENT_NAME:-unknown}" >&2
            exit 2
          fi
          if [[ ! "$n" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number: $n" >&2
            exit 2
          fi
          printf 'number=%s\n' "$n" >> "$GITHUB_OUTPUT"
          echo "Checking PR #$n"

      - name: Check unresolved bot review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: ./scripts/check_pr_reviews.sh "$PR_NUMBER"
