name: Release

# Publishes binaries for v*.*.* tags. Maintainers must pass the full slow suite
# (./scripts/run_slow_tests.sh — z80doc + system-tests + z80full) before tagging;
# this workflow does not re-run those tests. See docs/RELEASE.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (vX.Y.Z). Required for publishing; leave empty only to build unsigned-style dev artifacts from the current ref."
        required: false
        type: string

# Least privilege: only the publish job mints a release / attestations.
# Signing secrets are optional; steps no-op when they are absent.
permissions:
  contents: read

# One release attempt per tag/ref; do not cancel an in-flight publish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  resolve:
    name: Resolve release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolved.outputs.ref }}
      tag: ${{ steps.resolved.outputs.tag }}
    steps:
      - name: Resolve release ref
        id: resolved
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_REF: ${{ github.ref }}
          DEFAULT_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_TAG:-}" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "manual tag must match vMAJOR.MINOR.PATCH, got: $INPUT_TAG" >&2
              exit 1
            fi
            if ! gh api "repos/${REPO}/git/ref/tags/${INPUT_TAG}" >/dev/null; then
              echo "tag does not exist on this repository: $INPUT_TAG" >&2
              exit 1
            fi
            echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ ! "$DEFAULT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "pushed tag must match vMAJOR.MINOR.PATCH, got: $DEFAULT_TAG" >&2
              exit 1
            fi
            echo "ref=${DEFAULT_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"
          else
            # Empty workflow_dispatch: build development artefacts from the current ref.
            echo "ref=${DEFAULT_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: .tar.gz is the usual Unix distribution form.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Windows also builds Inno Setup *-setup.exe (see Build Windows installer).
          # macOS: primary .dmg (app + Applications shortcut) + secondary .zip.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: zip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # Signing scripts run with credentials — always take them from the default
      # branch, never from a tag-controlled tree (CWE-829).
      - name: Fetch trusted signing scripts
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: true
          path: .trusted-ci
          persist-credentials: false

      - name: Version
        id: version
        shell: bash
        env:
          REF: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux GUI/audio deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libglib2.0-dev libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build binaries
        shell: bash
        # Primary release deliverable is `spec_chum` only (#231). Headless
        # debug/agent lives on the same binary (`--serve` / `debug …`).
        run: cargo build --release -p app --target ${{ matrix.target }}

      - name: Stage release tree
        id: stage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT="spec-chum-${VERSION}-${TARGET}"
          mkdir -p "dist/$OUT"
          BIN_DIR="target/${TARGET}/release"
          if [[ "$TARGET" == *windows* ]]; then
            cp "$BIN_DIR/spec_chum.exe" "dist/$OUT/"
          elif [[ "$TARGET" == *apple-darwin* ]]; then
            chmod +x scripts/ci/stage-macos-egui-app.sh
            scripts/ci/stage-macos-egui-app.sh \
              "$VERSION" \
              "$BIN_DIR/spec_chum" \
              "dist/$OUT/Spec Chum.app"
          else
            cp "$BIN_DIR/spec_chum" "dist/$OUT/"
            strip "dist/$OUT/spec_chum" || true
          fi
          cp LICENSE "dist/$OUT/"
          if find "dist/$OUT" -iname '*.rom' | grep -q .; then
            echo "error: ROM files must not be packaged" >&2
            exit 1
          fi
          {
            echo "Spec Chum ${VERSION} (${TARGET})"
            echo ""
            if [[ "$TARGET" == *apple-darwin* ]]; then
              echo "Contents:"
              echo "  Spec Chum.app/   — egui host"
              echo "  Applications/   — shortcut (DMG only; drag Spec Chum.app here)"
              echo ""
              echo "Prefer the .dmg release asset: open it and drag Spec Chum.app to"
              echo "Applications. The .zip is a secondary unpack-anywhere layout."
              echo ""
              echo "Headless debugger / agent HTTP: run the binary inside the .app with"
              echo "  Spec\\ Chum.app/Contents/MacOS/spec_chum --serve …"
              echo "  Spec\\ Chum.app/Contents/MacOS/spec_chum debug …"
              echo ""
              echo "When Apple notary secrets are configured, the .dmg (and the"
              echo ".app inside the secondary .zip) are notarised and stapled."
              echo ""
            elif [[ "$TARGET" == *windows* ]]; then
              echo "Contents: spec_chum.exe (portable zip) or Start Menu install via *-setup.exe"
              echo "Headless: spec_chum.exe --serve …   or   spec_chum.exe debug …"
              echo ""
            else
              echo "Contents: spec_chum"
              echo "Headless: ./spec_chum --serve …   or   ./spec_chum debug …"
              echo "Runtime: GTK 3 + ALSA (e.g. libgtk-3-0, libasound2 on Debian/Ubuntu)."
              echo ""
            fi
            echo "System ROMs are not included. Fetch them with ./scripts/fetch_roms.sh"
            echo "from a source checkout, or see README.md."
          } > "dist/$OUT/README.txt"
          echo "dir=dist/$OUT" >> "$GITHUB_OUTPUT"

      - name: Codesign macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          chmod +x .trusted-ci/scripts/ci/sign-macos.sh
          .trusted-ci/scripts/ci/sign-macos.sh \
            "${STAGE_DIR}/Spec Chum.app"

      - name: Build macOS DMG
        id: dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="spec-chum-${VERSION}-${TARGET}"
          mkdir -p packed
          chmod +x scripts/ci/create-macos-dmg.sh
          scripts/ci/create-macos-dmg.sh \
            "$VERSION" \
            "${STAGE_DIR}/Spec Chum.app" \
            "packed/${OUT}.dmg" \
            "${STAGE_DIR}/LICENSE" \
            "${STAGE_DIR}/README.txt"
          echo "asset=packed/${OUT}.dmg" >> "$GITHUB_OUTPUT"

      - name: Codesign macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DMG_ASSET: ${{ steps.dmg.outputs.asset }}
        run: |
          chmod +x .trusted-ci/scripts/ci/sign-macos.sh
          .trusted-ci/scripts/ci/sign-macos.sh "$DMG_ASSET"

      # Notary credentials from the default-branch trusted tree (same CWE-829
      # pattern as codesign). Soft-skips when secrets are absent.
      - name: Notarise and staple macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG_ASSET: ${{ steps.dmg.outputs.asset }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          chmod +x .trusted-ci/scripts/ci/notarize-macos.sh
          .trusted-ci/scripts/ci/notarize-macos.sh \
            "$DMG_ASSET" \
            "${STAGE_DIR}/Spec Chum.app"

      - name: Authenticode-sign Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          & ".trusted-ci/scripts/ci/sign-windows.ps1" `
            "$env:STAGE_DIR/spec_chum.exe"

      # Inno Setup installer wraps the (optionally signed) staged exe.
      # Install tool from Chocolatey; compile script from the release tree.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build Windows installer
        id: win_setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          $Out = "spec-chum-$env:VERSION-$env:TARGET-setup.exe"
          New-Item -ItemType Directory -Force -Path packed | Out-Null
          & "scripts/ci/build-windows-installer.ps1" `
            $env:VERSION `
            $env:STAGE_DIR `
            "packed/$Out"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "asset=packed/$Out"

      - name: Authenticode-sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          SETUP_ASSET: ${{ steps.win_setup.outputs.asset }}
        run: |
          & ".trusted-ci/scripts/ci/sign-windows.ps1" `
            $env:SETUP_ASSET

      - name: Pack archive
        id: pack
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ steps.version.outputs.version }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
          DMG_ASSET: ${{ steps.dmg.outputs.asset }}
          SETUP_ASSET: ${{ steps.win_setup.outputs.asset }}
        run: |
          set -euo pipefail
          OUT="spec-chum-${VERSION}-${TARGET}"
          # Sanity: one primary application per platform (#231).
          if [[ "$TARGET" == *apple-darwin* ]]; then
            test -d "${STAGE_DIR}/Spec Chum.app/Contents/MacOS"
            test -x "${STAGE_DIR}/Spec Chum.app/Contents/MacOS/spec_chum"
            test ! -e "${STAGE_DIR}/spec-chum-debug"
            test -f "${DMG_ASSET}"
          elif [[ "$TARGET" == *windows* ]]; then
            test -f "${STAGE_DIR}/spec_chum.exe"
            test ! -e "${STAGE_DIR}/spec-chum-debug.exe"
            test -f "${SETUP_ASSET}"
          else
            test -x "${STAGE_DIR}/spec_chum"
            test ! -e "${STAGE_DIR}/spec-chum-debug"
          fi
          mkdir -p packed
          if [[ "$ARCHIVE" == zip ]]; then
            (cd dist && python -c "import shutil; shutil.make_archive('../packed/${OUT}', 'zip', '.', '${OUT}')")
            echo "asset=packed/${OUT}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C dist -czf "packed/${OUT}.tar.gz" "$OUT"
            echo "asset=packed/${OUT}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-chum-${{ steps.version.outputs.version }}-${{ matrix.target }}
          # Flatten packed/* so download-artifact + checksums see bare filenames.
          path: packed/*
          if-no-files-found: error
  publish:
    name: checksums, attest, GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        id: sums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          cd dist
          sha256sum spec-chum-* > SHA256SUMS
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            keyfile="$(mktemp)"
            printf '%s\n' "$GPG_PRIVATE_KEY" >"$keyfile"
            gpg --batch --import "$keyfile"
            rm -f "$keyfile"
            extra=()
            if [[ -n "${GPG_PASSPHRASE:-}" ]]; then
              extra=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
            fi
            gpg --batch --yes "${extra[@]}" --detach-sign --armor SHA256SUMS
          else
            echo "skip: GPG_PRIVATE_KEY not set; SHA256SUMS unsigned"
          fi
          ls -la

      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/*
          body: |
            Cross-platform **egui** host (`spec_chum`) with headless debugger / agent HTTP
            on the **same** binary (`spec_chum --serve` / `spec_chum debug …`).

            | Platform | Archive contents |
            | --- | --- |
            | **macOS** | **`.dmg`** (primary): `Spec Chum.app` + Applications shortcut; secondary `.zip` of the same tree |
            | **Windows** | Portable `.zip` (`spec_chum.exe`) **and** Inno Setup `*-setup.exe` (Start Menu + uninstall) |
            | **Linux** | `spec_chum` in a `.tar.gz` |

            System ROMs are **not** included — fetch with `./scripts/fetch_roms.sh`.

            Verify downloads with `SHA256SUMS` (and `SHA256SUMS.asc` when GPG signing is configured).
            GitHub Artifact Attestations are attached to this workflow run.

            Linux runtime: GTK 3 and ALSA (`libgtk-3-0`, `libasound2` on Debian/Ubuntu).
            Remaining packaging (AppImage / `.deb`) and shared app icon: issue #231.
            Notarisation secrets: issue #354.
