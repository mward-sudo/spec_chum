[package]
name = "control_plane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Spec Chum control / inspect / debug backend (#210)"
publish = false

[dependencies]
host_api = { workspace = true }
machine = { workspace = true }
trace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
png = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
objc2 = "0.6"

[dev-dependencies]
formats = { workspace = true }
tape = { workspace = true }

# Crate-local lints (#171): pedantic warn with endemic cast/name allows.
# Cannot mix `workspace = true` with overrides — keep in sync with root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "allow"
# Endemic bitflags / capacity math — do not enable workspace-wide.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"
large_stack_arrays = "allow"
format_push_string = "allow"
# Present letterbox fit; session/hardware status flag packs.
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
