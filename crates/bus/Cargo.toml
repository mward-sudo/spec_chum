[package]
name = "bus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spec Chum bus crate"

[dependencies]
ula = { workspace = true }
formats = { workspace = true }
trace = { workspace = true }
thiserror = { workspace = true }

# Crate-local lints (#171): pedantic warn with endemic cast/name allows.
# Cannot mix `workspace = true` with overrides — keep in sync with root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "allow"
# Endemic bit-twiddling / hardware constants — do not enable workspace-wide.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"
large_stack_arrays = "allow"
format_push_string = "allow"
# Peripheral state machines pack many bools / flag→u8 conversions.
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
bool_to_int_with_if = "allow"
cast_precision_loss = "allow"
match_same_arms = "allow"
