[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spec Chum egui frontend"
default-run = "spec_chum"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "spec_chum"
path = "src/main.rs"

[dependencies]
machine = { workspace = true }
formats = { workspace = true }
tape = { workspace = true }
trace = { workspace = true }
control_plane = { workspace = true }
agent_server = { workspace = true }
debug_cli = { workspace = true }
parking_lot = { workspace = true }
host_api = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
cpal = { workspace = true }
gilrs = { workspace = true }
rfd = "0.15"
anyhow = { workspace = true }
thiserror = { workspace = true }
raw-window-handle = "0.6"
png = { workspace = true }

[build-dependencies]
winres = "0.1"

# Crate-local lints (#171): pedantic warn with endemic cast/name allows.
# Cannot mix `workspace = true` with overrides — keep in sync with root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "allow"
# Endemic bitflags / capacity math — do not enable workspace-wide.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"
large_stack_arrays = "allow"
format_push_string = "allow"
# UI prefs / audio floats / layout ratios; egui flag packs; match clarity.
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
float_cmp = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
