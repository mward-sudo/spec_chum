[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spec Chum egui frontend"
default-run = "spec_chum"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "spec_chum"
path = "src/main.rs"

[dependencies]
machine = { workspace = true }
formats = { workspace = true }
tape = { workspace = true }
trace = { workspace = true }
control_plane = { workspace = true }
agent_server = { workspace = true }
parking_lot = { workspace = true }
host_api = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
cpal = { workspace = true }
gilrs = { workspace = true }
rfd = "0.15"
anyhow = { workspace = true }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
objc2 = "0.6"

[lints]
workspace = true
