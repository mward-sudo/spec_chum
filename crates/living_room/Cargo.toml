[package]
name = "living_room"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental Bevy 3D UK living-room CRT host for Spec Chum"
publish = false
default-run = "spec-chum-room"

[lib]
name = "spec_chum_room"
# staticlib for SpecChumMac; cdylib is unsupported next to host_api (duplicate Rust/Bevy).
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "spec-chum-room"
path = "src/main.rs"
required-features = ["standalone"]

# Headless tick budget gate (IOSurface-like present path).
[[example]]
name = "room_perf"
path = "examples/room_perf.rs"

# One-shot headless smoke (create + few ticks).
[[example]]
name = "room_probe"
path = "examples/room_probe.rs"

[features]
default = ["standalone"]
# Bevy winit host + cpal + rfd chrome (dev harness). SpecChumMac builds without this.
standalone = ["dep:cpal", "dep:rfd"]

[dependencies]
host_api = { workspace = true }
control_plane = { workspace = true }
agent_server = { workspace = true }
machine = { workspace = true }
bevy = { workspace = true, features = ["jpeg"] }
cpal = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = "0.5"
# Unconditional: `present.rs` uses `wgpu::Texture` on all targets.
# Must track Bevy 0.19's wgpu (Metal HAL import in present_metal.rs).
wgpu = "=29.0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLDevice",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLTypes",
    "MTLResource",
    "objc2-io-surface",
    "std",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = [
    "IOSurfaceRef",
    "std",
] }

# Crate-local lints (#171): pedantic warn with endemic cast/name allows.
# Cannot mix `workspace = true` with overrides — keep in sync with root Cargo.toml.
# Bevy systems / Metal present / camera math add float and bool-pack noise beyond cores.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "allow"
# Endemic bitflags / capacity math — do not enable workspace-wide.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"
large_stack_arrays = "allow"
format_push_string = "allow"
# Bevy camera / glow / present floats; hybrid flag packs; Metal timing.
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
float_cmp = "allow"
items_after_statements = "allow"
# Bevy systems take Res/Query/Event by value; Metal/IOSurface/Bevy ids in docs.
needless_pass_by_value = "allow"
doc_markdown = "allow"
