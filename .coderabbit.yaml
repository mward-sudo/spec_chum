# CodeRabbit — on-demand reviews (usage reduction)
# Docs: https://docs.coderabbit.ai/configuration/auto-review
#       https://docs.coderabbit.ai/reference/review-commands
#
# Goal: do not burn review allowance on every push while iterating.
# Agents/humans: open draft PRs → when merge-candidate, undraft + request one full review.
#
# Trigger a review (when auto_review.enabled is false):
#   - First pass (merge-candidate): @coderabbitai full review
#     or label: coderabbit-review
#   - After fixes that move HEAD: @coderabbitai review (incremental)
# Prefer a *human* PR comment for those commands — CodeRabbit may ignore
# other bots ("Skipped: comment is from another GitHub bot").
#
# auto_incremental_review: controls automatic re-review on later pushes when
# auto-review / positive labels apply — not a prerequisite for the manual
# @coderabbitai review command (per CodeRabbit docs). Keep true so
# label-triggered / future auto-review stays incremental-friendly.
#
# If UI settings disagree with this file, resolve via CodeRabbit GitHub app
# (repo → Settings / Configuration). Prefer keeping Automatic Reviews off in
# the UI so this YAML remains the source of truth after it lands on main.
#
# Note: YAML on the branch under review is what CodeRabbit applies to that PR.

language: "en-US"

reviews:
  # Skip lockfile / plan / graphify noise (defaults already skip many binaries/media).
  # graphify-out is intentionally committed; exclude from review only (not .gitignore).
  path_filters:
    - "!**/Cargo.lock"
    - "!**/.cursor/plans/**"
    - "!**/graphify-out/**"

  auto_review:
    # No automatic review on open/push. Request explicitly when ready.
    enabled: false
    # Keep drafts quiet even if auto-review is re-enabled later.
    drafts: false
    # Automatic re-review on later pushes when auto-review/labels apply.
    # Manual @coderabbitai review / full review do not require this flag.
    auto_incremental_review: true
    # Early pause if automatic incremental review is ever re-enabled with auto_review.
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      # Keep only explicit opt-out; "WIP" would skip label-triggered reviews
      # on ready PRs and trip the merge gate.
      - "[skip review]"
    # Positive label opt-in while enabled: false (see docs).
    labels:
      - "coderabbit-review"
