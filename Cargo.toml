[workspace]
resolver = "2"
members = [
    "crates/z80",
    "crates/bus",
    "crates/ula",
    "crates/tape",
    "crates/formats",
    "crates/machine",
    "crates/trace",
    "crates/host_api",
    "crates/control_plane",
    "crates/agent_server",
    "crates/app",
    "crates/debug_cli",
    "crates/living_room",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mward-sudo/spec_chum"
authors = ["mward-sudo"]

[workspace.dependencies]
z80 = { path = "crates/z80" }
bus = { path = "crates/bus" }
ula = { path = "crates/ula" }
tape = { path = "crates/tape" }
formats = { path = "crates/formats" }
machine = { path = "crates/machine" }
trace = { path = "crates/trace" }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
cpal = "0.15"
gilrs = "0.11"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
host_api = { path = "crates/host_api" }
control_plane = { path = "crates/control_plane" }
agent_server = { path = "crates/agent_server" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
png = "0.17"
ureq = { version = "3", default-features = false, features = ["json"] }
bevy = "0.19"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
parking_lot = "0.12"

# Inherited by members via `lints.workspace = true`.
# CI uses `-D warnings`, so `warn` here fails the build.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Default `all` stays on; pedantic stays allow workspace-wide (#171 evaluation):
# cast_*/many_single_char_names/too_many_lines are endemic in emulator cores.
# Core crates (`z80`/`ula`/`bus`/`tape`/`formats`/`machine`/`trace`/`control_plane`/`host_api`/`agent_server`/`debug_cli`) enable pedantic crate-locally with endemic allows.
# Nursery stays off (missing_const_for_fn noise). See docs/TESTING.md.
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Prefer Result / expect-with-reason over bare unwrap in non-test code.
unwrap_used = "warn"
expect_used = "allow"

# macOS 27 dyld rejects cdylibs whose LC_SYMTAB string pool is not 8-byte aligned.
# Rust's strip=debuginfo path can mis-align large Bevy dylibs (rust-lang/rust#157750).
[profile.release.package.living_room]
strip = "none"
