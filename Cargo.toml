[workspace]
resolver = "2"
members = [
    "crates/z80",
    "crates/bus",
    "crates/ula",
    "crates/tape",
    "crates/formats",
    "crates/machine",
    "crates/trace",
    "crates/host_api",
    "crates/app",
    "crates/debug_cli",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mward-sudo/spec_chum"
authors = ["mward-sudo"]

[workspace.dependencies]
z80 = { path = "crates/z80" }
bus = { path = "crates/bus" }
ula = { path = "crates/ula" }
tape = { path = "crates/tape" }
formats = { path = "crates/formats" }
machine = { path = "crates/machine" }
trace = { path = "crates/trace" }
debug_cli = { path = "crates/debug_cli" }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
cpal = "0.15"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Inherited by members via `lints.workspace = true`.
# CI uses `-D warnings`, so `warn` here fails the build.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Default `all` stays on; pedantic is opt-in as warn with noisy lints allowed.
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Prefer Result / expect-with-reason over bare unwrap in non-test code.
unwrap_used = "warn"
expect_used = "allow"
